[task]
name = "ImageClassificationNano"

[model]
name = "VGG16"

[model.arch]
num_classes = 10

[train]
total_steps = 100
batch_size = 2
grad_accum_steps = 2
max_grad_norm = 1.0
log_interval = 4
eval_interval = 10
warmup_ratio = 0.03
wandb_project = "deep-learning-scratch"

[train.adam]
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]
