[task]
name = "ImageClassification"

[model]
name = "ResNet34"

[model.arch]
n_classes = 1000

[train]
total_steps = 125000
batch_size = 1024
grad_accum_steps = 1
max_grad_norm = 1.0
log_interval = 32
eval_interval = 2000
warmup_ratio = 0.03

[train.adam]
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]
